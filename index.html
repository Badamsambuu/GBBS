<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бараа Удирдах Систем</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background: #1e293b; color: #f8fafc; }
        .container { max-width: 1200px; margin: 40px auto; background: #0f172a; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; font-size: 24px; margin-bottom: 20px; }
        #statusBox { padding: 12px; background: #1e293b; margin-bottom: 20px; border-radius: 6px; color: #38bdf8; font-weight: bold; border: 1px solid #334155; text-align: center; }
        
        /* Product Entry Form Grid */
        form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)) auto; gap: 12px; margin-bottom: 25px; }
        input { padding: 12px; border-radius: 6px; background: #1e293b; color: white; border: 1px solid #334155; outline: none; font-size: 14px; width: 100%; box-sizing: border-box; }
        input:focus { border-color: #38bdf8; }
        
        /* Auto-calculated read-only fields */
        input:disabled { background: #1e293b70; color: #94a3b8; border-style: dashed; cursor: not-allowed; }
        
        .submit-btn { background: #10b981; font-weight: bold; cursor: pointer; border: none; padding: 12px 20px; border-radius: 6px; color: white; font-size: 14px; transition: background 0.2s; height: 100%; }
        .submit-btn:hover { background: #059669; }
        
        /* Workers Search Box Area */
        .search-container { margin-bottom: 20px; background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        .search-input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; color: #f8fafc; font-size: 15px; border-radius: 6px; }
        .search-input:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        
        /* Inventory Data Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 14px; border-bottom: 1px solid #334155; text-align: left; font-size: 14px; }
        th { background: #334155; color: #38bdf8; font-weight: 600; text-transform: uppercase; font-size: 12px; }
        tr:hover { background: #1e293b; }
        .delete-btn { background: #ef4444; border: none; padding: 6px 12px; border-radius: 4px; color: white; cursor: pointer; font-size: 12px; }
        .delete-btn:hover { background: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 Бараа Бүртгэл & Удирдлагын Систем (Supabase)</h2>
    
    <div id="statusBox">Систем ачаалж байна...</div>

    <form id="productForm">
        <input type="text" id="pName" placeholder="Барааны нэр" required>
        <input type="text" id="pType" placeholder="Төрөл" required>
        <input type="number" id="pCode" placeholder="Код" required>
        <input type="number" id="pPrice" placeholder="Үнэ (₮)" required>
        <input type="text" id="pVat" placeholder="Үнэ + НӨАТ (10%)" disabled>
        <input type="number" id="pStock" placeholder="Тоо ширхэг" required>
        <button type="submit" class="submit-btn">Нэмэх</button>
    </form>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Бараа хайх... (Нэр, Төрөл эсвэл Кодоор хайх боломжтой)">
    </div>

    <table>
        <thead>
            <tr>
                <th>Барааны нэр</th>
                <th>Төрөл</th>
                <th>Код</th>
                <th>Нэгж үнэ</th>
                <th>Үнэ + НӨАТ</th>
                <th>Тоо ширхэг</th>
                <th>Үйлдэл</th>
            </tr>
        </thead>
        <tbody id="inventoryTableBody">
            <tr><td colspan="7" style="text-align: center; color: #94a3b8; padding: 20px;">Сервэрээс бараа уншиж байна...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const SUPABASE_URL = "https://gybhoexgcjxdlrjbhizg.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5YmhvZXhnY2p4ZGxyamJoaXpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDc2NzksImV4cCI6MjA5NjEyMzY3OX0.Zo0_CeMztNdK3scal1F7C9UNUl54DxXpdOuqgT3n2ww";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    const productForm = document.getElementById('productForm');
    const tableBody = document.getElementById('inventoryTableBody');
    const statusBox = document.getElementById('statusBox');
    const priceInput = document.getElementById('pPrice');
    const vatInput = document.getElementById('pVat');
    const searchInput = document.getElementById('searchInput');

    // Global variable to keep the downloaded inventory cache for instant filtering
    let allProductsCache = [];

    // Auto calculate Price + 10%
    priceInput.addEventListener('input', () => {
        const price = parseFloat(priceInput.value);
        if (!isNaN(price) && price > 0) {
            const totalPriceWithVat = price * 1.10;
            vatInput.value = totalPriceWithVat.toLocaleString() + " ₮";
        } else {
            vatInput.value = "";
        }
    });

    // NEW: Real-Time Instant Search Filter Logic
    searchInput.addEventListener('input', () => {
        const query = searchInput.value.toLowerCase().trim();
        
        // Filter out products that don't match our criteria
        const filteredProducts = allProductsCache.filter(product => {
            const name = (product['Барааны нэр'] || '').toLowerCase();
            const type = (product['Төрөл'] || '').toLowerCase();
            const code = String(product['код'] || '').toLowerCase();
            
            return name.includes(query) || type.includes(query) || code.includes(query);
        });
        
        renderTable(filteredProducts);
    });

    async function fetchProducts() {
        try {
            const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending: false });
            if (error) {
                statusBox.style.color = "#ef4444";
                statusBox.innerText = "Алдаа: " + error.message;
                return;
            }
            statusBox.style.color = "#38bdf8";
            statusBox.innerText = "Холболт амжилттай! Нийт бараа: " + (data ? data.length : 0);
            
            // Update local cache and display
            allProductsCache = data || [];
            
            // Respect any active user search filter during data syncs
            if(searchInput.value.trim() !== "") {
                searchInput.dispatchEvent(new Event('input'));
            } else {
                renderTable(allProductsCache);
            }
        } catch (err) {
            statusBox.style.color = "#ef4444";
            statusBox.innerText = "Алдаа гарлаа: " + err.message;
        }
    }

    function renderTable(products) {
        tableBody.innerHTML = '';
        if(!products || products.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#94a3b8; padding: 20px;">Бараа олдсонгүй.</td></tr>';
            return;
        }

        products.forEach(product => {
            const row = `
                <tr>
                    <td><strong>${product['Барааны нэр'] || '—'}</strong></td>
                    <td><span style="color: #94a3b8;">${product['Төрөл'] || '—'}</span></td>
                    <td><code>${product['код'] || '0'}</code></td>
                    <td style="color: #4ade80; font-weight: bold;">${Number(product['нэгж үнэ'] || 0).toLocaleString()} ₮</td>
                    <td style="color: #f39c12; font-weight: bold;">${Number(product['НӨАТ'] || 0).toLocaleString()} ₮</td>
                    <td>${product['Барааны тооллого'] || '0'} ширхэг</td>
                    <td><button class="delete-btn" onclick="deleteProduct(${product.id})">Устгах</button></td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

    productForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        statusBox.innerText = "Хадгалж байна...";
        
        const priceValue = parseFloat(priceInput.value);
        const totalVatValue = priceValue * 1.10;
        
        const payload = {
            'id': Math.floor(10000000 + Math.random() * 90000000), 
            'Барааны нэр': document.getElementById('pName').value,
            'Төрөл': document.getElementById('pType').value,
            'код': parseFloat(document.getElementById('pCode').value), 
            'нэгж үнэ': priceValue,
            'НӨАТ': totalVatValue, 
            'Барааны тооллого': parseInt(document.getElementById('pStock').value)
        };

        const { error } = await supabaseClient.from('products').insert([payload]);
        if (error) {
            alert("Алдаа гарлаа: " + error.message);
            statusBox.innerText = "Алдаа: " + error.message;
        } else {
            productForm.reset();
            vatInput.value = ""; 
            fetchProducts(); 
        }
    });

    window.deleteProduct = async function(id) {
        if(confirm('Устгах уу?')) {
            await supabaseClient.from('products').delete().eq('id', id);
            fetchProducts();
        }
    }

    fetchProducts();
</script>

</body>
</html>
